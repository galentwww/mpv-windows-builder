[binaries]
mt = ['mt.exe']
ar = ['llvm-lib.exe']
windres = ['llvm-rc.exe']
c = ['clang-cl.exe']
c_ld = ['lld-link.exe']
cpp = ['clang-cl.exe']
cpp_ld = ['lld-link.exe']

# Native build on an ARM64 host; same options as windows-clangcl.ini plus an explicit target.
[build_machine]
endian = 'little'
system = 'windows'
cpu_family = 'aarch64'
cpu = 'aarch64'
[host_machine]
endian = 'little'
system = 'windows'
cpu_family = 'aarch64'
cpu = 'aarch64'


[built-in options]
werror = false

c_args = ['--target=aarch64-pc-windows-msvc', '/utf-8', '/MT', '/Zi', '-flto=thin', '-fuse-ld=lld']
cpp_args = ['--target=aarch64-pc-windows-msvc', '/utf-8', '/MT', '/Zi', '-flto=thin', '-fuse-ld=lld']

c_link_args = ['ksuser.lib', '-MANIFEST:NO']
cpp_link_args = ['ksuser.lib', '-MANIFEST:NO']
