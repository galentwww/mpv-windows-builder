name: build libmpv (LGPL)
on:
  workflow_dispatch:
    inputs:
      enableLto:
        description: 'enable LTO'
        required: false
        default: false
        type: boolean
      tag:
        description: 'release tag (YYYYMMDD); empty = today (UTC)'
        required: false
        default: ''
        type: string
      publish:
        description: 'create a GitHub Release from the packaged zip'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      packages: write

    env:
      FEED_URL: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
      VCPKG_BINARY_SOURCES: "clear;nuget,https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json,readwrite"
      ENABLE_LTO: ${{ inputs.enableLto }}
      ARCH: x64

    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
    - uses: actions/checkout@v4

    - name: msvc
      uses: microsoft/setup-msbuild@v2

    - name: tag
      id: tag
      shell: pwsh
      run: |
        $tag = '${{ inputs.tag }}'
        if (-not $tag) { $tag = (Get-Date).ToUniversalTime().ToString('yyyyMMdd') }
        if ($tag -notmatch '^\d{8}$') { throw "tag must be YYYYMMDD, got $tag" }
        "tag=$tag" >> $env:GITHUB_OUTPUT

    - name: Add NuGet sources
      shell: pwsh
      run: |
        .$(vcpkg.exe fetch nuget) `
          sources add `
          -Source "${{ env.FEED_URL }}" `
          -StorePasswordInClearText `
          -Name GitHubPackages `
          -UserName "${{ github.repository_owner }}" `
          -Password "${{ secrets.GITHUB_TOKEN }}"
        .$(vcpkg.exe fetch nuget) `
          setapikey "${{ secrets.GITHUB_TOKEN }}" `
          -Source "${{ env.FEED_URL }}"

    - name: tools
      run: |
        python -m pip install meson
        pip3 install jinja2
        mkdir pkg-config
        tar -xvf "deps\mingw-w64-x86_64-pkgconf-1~2.5.1-1-any.pkg.tar" -C pkg-config

    - name: build deps
      run: |
        $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -ne 'C:\Program Files\LLVM\bin' -and `
                                                           $_ -ne 'C:\Program Files\CMake\bin' -and `
                                                           $_ -ne 'C:\Strawberry\c\bin' }) -join ';'
        $env:VS_ROOT="C:\Program Files\Microsoft Visual Studio\18\Enterprise"
        $env:VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT
        if ($env:ENABLE_LTO -eq 'true') {
          .\build-deps-lto.ps1
        } else {
          .\build-deps.ps1
        }
        if ($LASTEXITCODE) { exit $LASTEXITCODE }

    - name: build mpv
      run: |
        $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -ne 'C:\Program Files\LLVM\bin' -and `
                                                           $_ -ne 'C:\Program Files\CMake\bin' -and `
                                                           $_ -ne 'C:\Strawberry\c\bin' }) -join ';'
        $env:VS_ROOT="C:\Program Files\Microsoft Visual Studio\18\Enterprise"
        if ($env:ENABLE_LTO -eq 'true') {
          .\build-mpv-lto.ps1
        } else {
          .\build-mpv.ps1
        }

    - name: package
      shell: pwsh
      run: |
        $triplet = if ($env:ENABLE_LTO -eq 'true') { "$env:ARCH-llvm-windows-static-mt-lto" } else { "$env:ARCH-llvm-windows-static-mt" }
        .\package-libmpv.ps1 -Tag '${{ steps.tag.outputs.tag }}' -Arch $env:ARCH -Triplet $triplet
        Copy-Item meson-setup.log dist/
        Get-Content dist/*.sha256
        Get-Content dist/stage-$env:ARCH/build-info.json

    - name: Print meson log
      if: ${{ failure() }}
      run: |
        Get-Content mpv-builder/mpv-windows/build/meson-logs/meson-log.txt -Tail 300 -ErrorAction SilentlyContinue

    - name: upload vcpkg logs
      if: ${{ failure() }}
      uses: actions/upload-artifact@v4
      with:
        name: vcpkg-logs
        path: |
          C:\vcpkg\buildtrees\**\*.log
          mpv-deps-builder\vcpkg_installed\vcpkg\issue_body.md
        if-no-files-found: ignore

    - name: upload libmpv
      uses: actions/upload-artifact@v4
      with:
        name: libmpv-lgpl-${{ steps.tag.outputs.tag }}-x64
        path: |
          dist/*.zip
          dist/*.sha256
          dist/meson-setup.log

  release:
    needs: build
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: dist
        merge-multiple: true

    - name: create release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ needs.build.outputs.tag }}
      run: |
        {
          echo "LGPL libmpv build (-Dgpl=false), ffmpeg without --enable-gpl / --enable-nonfree / --enable-version3."
          echo
          echo '```'
          cat dist/*.sha256
          echo '```'
          echo
          echo '<details><summary>meson setup</summary>'
          echo
          echo '```'
          cat dist/meson-setup.log
          echo '```'
          echo '</details>'
        } > notes.md
        gh release create "$TAG" dist/*.zip dist/*.sha256 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "libmpv LGPL $TAG" --notes-file notes.md
